<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Task Matrix - To-Do App</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Modular CSS Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/animations.css" />
</head>
<body>
  <div class="app-container">
    <h1>To-Do App</h1>
    
    <!-- Productivity Progress Bar -->
    <div class="progress-section">
      <div class="progress-header">
        <span id="progressText">0% Completed</span>
        <span id="progressCount">0 of 0 tasks</span>
      </div>
      <div class="progress-track">
        <div id="progressBarFill" class="progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Step 1: Bulk / Single Task Input -->
    <div class="input-group">
      <textarea id="taskInput" rows="1" placeholder="Enter task or paste multiple (separated by commas or lines)..."></textarea>
      <button id="addBtn">+ Add Task</button>
    </div>
    <p class="input-hint">💡 Tip: Separate items with commas or newlines to add multiple tasks</p>

    <!-- Step 2: Task List Container -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Empty State Message -->
    <div id="emptyState" class="empty-state">
      📝 No tasks yet! Add one above.
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <button id="clearCompletedBtn" class="clear-btn">🧹 Clear Completed</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
