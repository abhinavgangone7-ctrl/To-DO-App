<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app-container">
    <h1>To-Do App</h1>
    
    <!-- Productivity Progress Bar -->
    <div class="progress-section">
      <div class="progress-header">
        <span id="progressText">0% Completed</span>
        <span id="progressCount">0 of 0 tasks</span>
      </div>
      <div class="progress-track">
        <div id="progressBarFill" class="progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Step 1: Simple Task Input -->
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Enter a task..." />
      <button id="addBtn">Add Task</button>
    </div>

    <!-- Step 2: Task List Container -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Empty State Message -->
    <div id="emptyState" class="empty-state">
      📝 No tasks yet! Add one above.
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <button id="clearCompletedBtn" class="clear-btn">🧹 Clear Completed</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
